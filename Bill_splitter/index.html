<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Restaurant Bill Splitter</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="container">
    <h1>Restaurant Bill Splitter</h1>

    <p id="error" class="error"></p>

    <label for="billAmount">Bill Amount</label>
    <input type="number" id="billAmount" placeholder="Enter bill amount" />

    <label for="tipPercent">Tip Percentage</label>
    <select id="tipPercent">
      <option value="0">0%</option>
      <option value="5">5%</option>
      <option value="10">10%</option>
      <option value="15">15%</option>
      <option value="20">20%</option>
    </select>

    <label for="peopleCount">Number of People</label>
    <input type="number" id="peopleCount" placeholder="Enter number of people" />

    <button id="calculateBtn">Calculate</button>

    <div class="result">
      <p>Tip Amount: <span id="tipAmount">0.00</span></p>
      <p>Total Bill: <span id="totalBill">0.00</span></p>
      <p>Each Person Pays: <span id="perPerson">0.00</span></p>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
